<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>猫尾图鉴 · Cat Tail Park</title>
  <meta name="description" content="Photorealistic overhead multi-breed cat encyclopedia & interactive cat tail simulator. Reach for the tail and it dodges—sneak close or pet its back to catch and stroke it!" />
  <meta property="og:title" content="Cat Tail Park · 猫尾图鉴" />
  <meta property="og:description" content="Interactive photorealistic cat tail dodging & petting simulator with 8 cat breeds." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --bg: #fbf5ec;
      --surface: #fffcf7;
      --surface-alt: #f4eadc;
      --border: #e5d6c3;
      --ink: #3b2a1d;
      --ink-muted: #7a6452;
      --accent: #c9732e;
      --accent-soft: #f5e2cc;
      --ok: #2e8555;
      --shadow: 0 10px 30px rgba(68, 42, 18, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 18px 40px;
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand span {
      font-size: 13px;
      color: var(--ink-muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn, .lang-select {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 140ms ease;
      font-family: inherit;
    }

    .lang-select {
      padding-right: 26px;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
      background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .btn:hover, .lang-select:hover {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .btn.active {
      background: var(--ink);
      color: #fffcf7;
      border-color: var(--ink);
    }

    .badge-progress {
      font-size: 12.5px;
      color: var(--ink-muted);
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .badge-progress strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* Stage */
    .stage-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: #d8bc99;
    }

    #stage {
      display: block;
      width: 100%;
      height: 390px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .hud-top-left {
      pointer-events: none;
      position: absolute;
      top: 12px;
      left: 14px;
      max-width: calc(100% - 170px);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34, 22, 12, 0.62);
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      flex-shrink: 0;
    }
    .dot.ok { background: #34d399; }

    .hud-top-right {
      pointer-events: none;
      position: absolute;
      top: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34, 22, 12, 0.54);
      color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
    }

    .meter {
      width: 64px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      background: #6ee7b7;
      width: 15%;
    }

    .hud-bottom {
      pointer-events: none;
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(34, 22, 12, 0.68);
      color: #fff;
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 180ms ease;
      white-space: nowrap;
    }

    .hud-bottom.show { opacity: 1; }
    .hud-bottom .meter { width: 128px; }

    /* Breed Encyclopedia Section */
    .encyclopedia {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
    }

    @media (max-width: 780px) {
      .encyclopedia { grid-template-columns: 1fr; }
      #stage { height: 320px; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13.5px;
      font-weight: 600;
      gap: 8px;
    }

    .panel-title small {
      font-weight: 400;
      color: var(--ink-muted);
      font-size: 12px;
    }

    .breed-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 520px) {
      .breed-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .breed-card {
      position: relative;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 9px 10px;
      cursor: pointer;
      transition: all 140ms ease;
      color: var(--ink);
    }

    .breed-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .breed-card.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .breed-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(59, 42, 29, 0.22);
    }

    .caught-tag {
      font-size: 10.5px;
      color: var(--ok);
      font-weight: 600;
    }

    .breed-name {
      font-size: 13px;
      font-weight: 600;
      display: block;
    }

    .breed-sub {
      font-size: 11px;
      color: var(--ink-muted);
      display: block;
      margin-top: 1px;
    }

    /* Profile Card */
    .profile-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .profile-head h2 {
      margin: 0;
      font-size: 17px;
    }

    .profile-head span {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .tag {
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--ink);
    }

    .profile-desc {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-muted);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .stat-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 7px 9px;
      text-align: center;
    }

    .stat-box .val {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: block;
    }

    .stat-box .lbl {
      font-size: 11px;
      color: var(--ink-muted);
    }

    .footer-hint {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-muted);
    }
  </style>
</head>

          <option value="en">English</option>
          <option value="ja">日本語</option>

          <option value="es">Español</option>

      <div id="patience-wrap" class="hud-bottom">

        <div class="meter"><div id="patience-bar" class="meter-fill" style="width:100%;background:#fcd34d;"></div></div>
      </div>
    </section>

    <section class="encyclopedia">
      <div class="panel">

          <span id="ui-enc-title">猫咪品种图鉴</span>

        </div>
        <div id="breed-grid" class="breed-grid"></div>
      </div>

      <aside class="panel" id="breed-profile">
        <div class="profile-head">
          <h2 id="p-name"></h2>
          <span id="p-en"></span>
        </div>
        <div id="p-tags" class="profile-tags"></div>
        <p id="p-desc" class="profile-desc"></p>
        <div class="stats-row">
          <div class="stat-box">
            <span id="s-dodge" class="val">0</span>
            <span id="ui-stat-dodge" class="lbl">尾巴躲开</span>
          </div>
          <div class="stat-box">
            <span id="s-catch" class="val">0</span>
            <span id="ui-stat-catch" class="lbl">成功抓到</span>
          </div>
          <div class="stat-box">
            <span id="s-hold" class="val">5.0s</span>
            <span id="ui-stat-hold" class="lbl">基础可撸</span>
          </div>
        </div>
      </aside>
    </section>

    <footer class="footer-hint">
      <span id="ui-footer-tip"></span>
      <span id="ui-footer-keys"></span>
    </footer>
  </main>

      const spriteCache = {};
      function loadBreedSprites(b) {
        if (spriteCache[b.id]) return spriteCache[b.id];
        const entry = { body: new Image(), tail: new Image(), ready: 0 };
        entry.body.onload = () => { entry.ready++; };
        entry.tail.onload = () => { entry.ready++; };
        entry.body.src = INLINED_ASSETS[b.id + '_body'];
        entry.tail.src = INLINED_ASSETS[b.id + '_tail'];
        spriteCache[b.id] = entry;
        return entry;
      }

      function renderEncyclopedia() {
        const t = T();
        breedGrid.innerHTML = '';
        let unlocked = 0;
        BREEDS.forEach((b, idx) => {

          if (st.catch > 0) unlocked++;
          const btn = document.createElement('button');
          btn.className = 'breed-card' + (idx === currentIdx ? ' selected' : '');
          btn.innerHTML = `
            <div class="breed-top">
              <span class="swatch" style="background:${b.swatch}"></span>

      // Warm sunlit oak floor canvas
      const floorCanvas = document.createElement('canvas');
      function buildWoodFloor(w, h) {
        floorCanvas.width = Math.max(1, Math.round(w));
        floorCanvas.height = Math.max(1, Math.round(h));
        const fc = floorCanvas.getContext('2d');
        const bgGrad = fc.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, '#e6d1b6');
        bgGrad.addColorStop(0.55, '#d8bc99');
        bgGrad.addColorStop(1, '#c8a782');
        fc.fillStyle = bgGrad;
        fc.fillRect(0, 0, w, h);

        const plankH = 60;
        let seed = 2026;
        const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
        for (let py = 0; py < h; py += plankH) {
          const tint = (rand() - 0.5) * 14;
          fc.fillStyle = `rgba(${tint > 0 ? 255 : 95},${tint > 0 ? 238 : 65},${tint > 0 ? 210 : 38},${Math.abs(tint) / 145})`;
          fc.fillRect(0, py, w, plankH);
          for (let g = 0; g < 18; g++) {
            const gy = py + rand() * plankH;
            fc.beginPath();
            fc.moveTo(0, gy);
            for (let gx = 0; gx <= w; gx += 52) fc.lineTo(gx, gy + Math.sin(gx * 0.011 + g) * 1.6);
            fc.strokeStyle = `rgba(110,74,42,${0.032 + rand() * 0.038})`;
            fc.lineWidth = 0.8 + rand() * 1.2;
            fc.stroke();
          }
          fc.fillStyle = 'rgba(84,54,28,0.16)';
          fc.fillRect(0, py, w, 1.2);
          fc.fillStyle = 'rgba(84,54,28,0.12)';
          fc.fillRect((rand() * 0.7 + 0.15) * w, py, 1.2, plankH);
        }
        const sunGrad = fc.createRadialGradient(w * 0.25, h * 0.12, 20, w * 0.35, h * 0.35, w * 0.72);
        sunGrad.addColorStop(0, 'rgba(255,248,232,0.38)');
        sunGrad.addColorStop(0.55, 'rgba(255,242,215,0.12)');
        sunGrad.addColorStop(1, 'rgba(70,45,22,0.14)');
        fc.fillStyle = sunGrad;
        fc.fillRect(0, 0, w, h);
      }

      function ensureAudio() {
        if (!soundOn) return;
        try {
          if (!audioCtx) {

            const bufLen = audioCtx.sampleRate * 2;
            const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < bufLen; i++) {
              const white = Math.random() * 2 - 1;
              data[i] = (lastOut + 0.025 * white) / 1.025;
              lastOut = data[i];
              data[i] *= 3.5;
            }
            const src = audioCtx.createBufferSource();
            src.buffer = noiseBuf;
            src.loop = true;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 115;
            filter.Q.value = 1.4;
            purrLfo = audioCtx.createOscillator();
            purrLfo.type = 'sine';
            purrLfo.frequency.value = breed.purrHz;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 0.45;
            const modGain = audioCtx.createGain();
            modGain.gain.value = 0.55;
            purrLfo.connect(lfoGain);
            lfoGain.connect(modGain.gain);
            purrGain = audioCtx.createGain();
            purrGain.gain.value = 0.0001;
            src.connect(filter);
            filter.connect(modGain);
            modGain.connect(purrGain);
            purrGain.connect(audioCtx.destination);
            src.start();
            purrLfo.start();
          }
          if (purrLfo) purrLfo.frequency.setTargetAtTime(breed.purrHz, audioCtx.currentTime, 0.05);
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (_) {}
      }

      function setPurrLevel(level) {
        if (!audioCtx || !purrGain) return;
        const target = soundOn ? Math.max(0.0001, level * 0.22) : 0.0001;
        purrGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.08);
      }

      function playWhoosh() {
        if (!soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.09);
          g.gain.setValueAtTime(0.045, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (_) {}
      }

      function initTail() {
        nodes.length = 0;
        for (let i = 0; i < NODES; i++) {
          nodes.push({
            x: layout.tailBaseX + i * layout.segLen,
            y: layout.tailBaseY - Math.sin(i * 0.26) * 18 * layout.scale,
            vx: 0, vy: 0, furTravel: 0
          });
        }
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = rect.height || 390;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildWoodFloor(width, height);

        const s = Math.min(1.18, Math.max(0.72, width / 760));
        layout.scale = s;
        layout.catW = 355 * s;
        layout.catH = layout.catW * (302 / 489);
        layout.catX = Math.max(layout.catW * 0.52 + 12, width * 0.29);
        layout.catY = height * 0.52;
        layout.tailBaseX = layout.catX + layout.catW * 0.42;
        layout.tailBaseY = layout.catY + layout.catH * 0.03;
        layout.segLen = 17.5 * s;

        if (nodes.length === 0) initTail();
        else { nodes[0].x = layout.tailBaseX; nodes[0].y = layout.tailBaseY; }
      }

      function selectBreed(idx) {
        currentIdx = (idx + BREEDS.length) % BREEDS.length;
        breed = BREEDS[currentIdx];
        loadBreedSprites(breed);
        tailState = 'free';
        escapeCooldown = 0;
        calm = 0.16;
        swapFade = 0.2;
        patienceWrap.classList.remove('show');
        initTail();
        if (purrLfo && audioCtx) purrLfo.frequency.setTargetAtTime(breed.purrHz, audioCtx.currentTime, 0.05);
        setStatus(T().statusSwitched(BText(breed).name), false);
        renderEncyclopedia();
      }

      function setStatus(text, isOk) {
        statusText.textContent = text;
        statusDot.className = isOk ? 'dot ok' : 'dot';
      }

      function spawnText(text, x, y, tone) { floatTexts.push({ text, x, y, vy: -0.7, life: 1, tone: tone || 'warm' }); }
      function spawnRipple(x, y, color) { ripples.push({ x, y, r: 5, life: 1, color: color || 'rgba(255,255,255,0.75)' }); }

      function closestTailNode(px, py) {
        let bestIdx = -1, bestDist = Infinity;
        for (let i = 2; i < NODES; i++) {
          const d = Math.hypot(nodes[i].x - px, nodes[i].y - py);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        return { idx: bestIdx, dist: bestDist };
      }

      function isOverCatBody(px, py) {
        const dx = (px - (layout.catX - layout.catW * 0.03)) / (layout.catW * 0.44);
        const dy = (py - layout.catY) / (layout.catH * 0.43);
        return dx * dx + dy * dy <= 1;
      }

      function enterCaught(idx, px, py) {
        tailState = 'caught';
        caughtIndex = Math.max(3, Math.min(NODES - 1, idx));
        holdMax = breed.holdDuration * (1 + calm * 0.45);
        holdTimer = holdMax;
        strokeAccumulator = 0;
        stats[breed.id].catch++;
        saveStats();
        renderEncyclopedia();
        patienceWrap.classList.add('show');
        setStatus(T().statusCaught(BText(breed).name), true);
        spawnRipple(px, py, 'rgba(110,231,183,0.9)');
        spawnText(T().caughtPop, px, Math.max(32, py - 24), 'catch');
      }

      function releaseIntoEscape(reasonText) {
        tailState = 'escaping';
        escapeCooldown = 0.72;
        patienceWrap.classList.remove('show');
        evasiveDir = (pointer.y < layout.tailBaseY) ? 1 : -1;
        for (let i = 2; i < NODES; i++) {
          const n = nodes[i], w = i / NODES;
          const dx = n.x - pointer.x, dy = n.y - pointer.y, d = Math.hypot(dx, dy) + 1;
          n.vx += (dx / d) * breed.whipBurst * w * 0.75;
          n.vy += (dy / d) * breed.whipBurst * w * 0.8 + evasiveDir * breed.whipBurst * w * 0.75;
        }
        calm = Math.max(0.08, calm - 0.18);
        playWhoosh();
        const tip = nodes[NODES - 1];
        spawnText(reasonText || T().escapedDefault, Math.min(width - 60, Math.max(50, tip.x)), Math.max(32, tip.y - 18), 'dodge');
        setStatus(T().statusEscaped, false);
      }

      function triggerDodgeBurst(px, py, forceful) {
        const now = performance.now();
        evasiveDir = py < layout.tailBaseY ? 1 : -1;
        for (let i = 2; i < NODES; i++) {
          const n = nodes[i], w = i / NODES;
          const dx = n.x - px, dy = n.y - py, d = Math.hypot(dx, dy) + 1;
          const p = (forceful ? breed.whipBurst : breed.whipBurst * 0.58) * w * (1 - calm * 0.25);
          n.vx += (dx / d) * p * 0.65;
          n.vy += (dy / d) * p * 0.85 + evasiveDir * p * 0.6;
        }
        if (now - lastDodgeAt > 460) {
          stats[breed.id].dodge++;
          saveStats();
          sDodge.textContent = stats[breed.id].dodge;
          lastDodgeAt = now;
          playWhoosh();
          const qs = BText(breed).quips;
          const tip = nodes[NODES - 1];
          spawnText(qs[Math.floor(Math.random() * 2)], Math.min(width - 60, Math.max(50, tip.x)), Math.max(32, tip.y - 18), 'dodge');
        }
      }

      function wrapAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }

      function buildSmoothSpine(subdivs) {
        const pts = [], nLen = nodes.length;
        for (let i = 0; i < nLen - 1; i++) {
          const p0 = nodes[Math.max(0, i - 1)], p1 = nodes[i];
          const p2 = nodes[i + 1], p3 = nodes[Math.min(nLen - 1, i + 2)];
          const steps = i === nLen - 2 ? subdivs + 1 : subdivs;
          for (let s = 0; s < steps; s++) {
            const t = s / subdivs, t2 = t * t, t3 = t2 * t;
            const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
            const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
            pts.push({ x, y, furTravel: p1.furTravel + (p2.furTravel - p1.furTravel) * t });
          }
        }
        return pts;
      }

      function drawTexturedTriangle(g, photo, a, b, c) {
        const u = b.s - a.s, v = b.t - a.t, p = c.s - a.s, q = c.t - a.t, D = u * q - v * p;
        if (Math.abs(D) < 1e-4) return;
        const X = b.x - a.x, Y = b.y - a.y, Z = c.x - a.x, W = c.y - a.y;
        const m = (X * q - Z * v) / D, n = (Y * q - W * v) / D;
        const h = (Z * u - X * p) / D, k = (W * u - Y * p) / D;
        const ab = Math.hypot(X, Y), ac = Math.hypot(Z, W), bc = Math.hypot(X - Z, Y - W), perim = ab + ac + bc;
        if (perim < 0.01) return;
        const cx = (a.x * bc + b.x * ac + c.x * ab) / perim, cy = (a.y * bc + b.y * ac + c.y * ab) / perim;
        const expand = Math.min(1.15, 0.55 * perim / Math.max(0.05, Math.abs(X * W - Y * Z)));

        g.save();
        g.beginPath();
        const pts = [a, b, c];
        for (let i = 0; i < 3; i++) {
          const ex = pts[i].x + (pts[i].x - cx) * expand;
          const ey = pts[i].y + (pts[i].y - cy) * expand;
          if (i === 0) g.moveTo(ex, ey); else g.lineTo(ex, ey);
        }
        g.closePath();
        g.clip();
        g.transform(m, n, h, k, a.x - m * a.s - h * a.t, a.y - n * a.s - k * a.t);
        const l = Math.max(0, Math.floor(Math.min(a.s, b.s, c.s)) - 1);
        const t = Math.max(0, Math.floor(Math.min(a.t, b.t, c.t)) - 1);
        const w = Math.min(photo.width, Math.ceil(Math.max(a.s, b.s, c.s)) + 1) - l;
        const hh = Math.min(photo.height, Math.ceil(Math.max(a.t, b.t, c.t)) + 1) - t;
        if (w > 0 && hh > 0) g.drawImage(photo, l, t, w, hh, l, t, w, hh);
        g.restore();
      }

      function drawPhotorealisticTail(tailImg) {
        if (!tailImg.complete || !tailImg.naturalWidth) return;
        const pw = tailImg.width, ph = tailImg.height;
        const halfH = ph * 0.5 * layout.scale * 0.56 * breed.tailScale;
        const spine = buildSmoothSpine(2);
        const S = spine.length;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(spine[0].x + 3, spine[0].y + 11 * layout.scale);
        for (let i = 1; i < S; i++) ctx.lineTo(spine[i].x + 4, spine[i].y + 12 * layout.scale);
        ctx.strokeStyle = 'rgba(42,24,10,0.22)';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 26 * layout.scale * breed.tailScale;
        ctx.filter = 'blur(7px)';
        ctx.stroke();
        ctx.restore();

        const bands = [0, 0.5, 1];
        let prevRow = null;
        for (let i = 0; i < S; i++) {
          const n = spine[i], prev = spine[Math.max(0, i - 1)], next = spine[Math.min(S - 1, i + 1)];
          const dx = next.x - prev.x, dy = next.y - prev.y, len = Math.hypot(dx, dy) || 1;
          const tx = dx / len, ty = dy / len, nx = -ty, ny = tx;
          let bendSign = 0;
          if (i > 0 && i < S - 1) {
            bendSign = wrapAngle(Math.atan2(next.y - n.y, next.x - n.x) - Math.atan2(n.y - prev.y, n.x - prev.x));
          }
          const u = (i / (S - 1)) * pw;
          const row = bands.map((b) => {
            const across = (b - 0.5) * 2;
            const isInner = across * bendSign > 0;
            const compress = isInner ? Math.max(0.72, 1 - Math.abs(bendSign) * 1.1) : 1;
            const nap = n.furTravel * Math.abs(across);
            return { s: u, t: b * ph, x: n.x + nx * across * halfH * compress + tx * nap, y: n.y + ny * across * halfH * compress + ty * nap };
          });
          if (prevRow) {
            for (let k = 0; k < bands.length - 1; k++) {
              drawTexturedTriangle(ctx, tailImg, prevRow[k], row[k], prevRow[k + 1]);
              drawTexturedTriangle(ctx, tailImg, prevRow[k + 1], row[k], row[k + 1]);
            }
          }
          prevRow = row;
        }
      }

      function update(dt) {
        time += dt;
        swapFade = Math.min(1, swapFade + dt * 3.8);
        if (escapeCooldown > 0) {
          escapeCooldown -= dt;
          if (escapeCooldown <= 0 && tailState === 'escaping') {
            tailState = 'free';
            setStatus(T().statusDefault(BText(breed).name), false);
          }
        }

        const segLen = layout.segLen;
        nodes[0].x = layout.tailBaseX;
        nodes[0].y = layout.tailBaseY;
        nodes[0].vx = 0;
        nodes[0].vy = 0;

        calm = Math.max(0.12, calm - dt * 0.024);
        calmBar.style.width = Math.round(calm * 100) + '%';
        backPetGlow = Math.max(0, backPetGlow - dt * 2.2);

        let purrTarget = 0;

        if (tailState === 'caught') {
          holdTimer -= dt;
          const ratio = Math.max(0, holdTimer / holdMax);
          patienceBar.style.width = Math.round(ratio * 100) + '%';
          patienceBar.style.backgroundColor = ratio < 0.28 ? '#fb7185' : '#fcd34d';
          purrTarget = pointer.speed > 0.8 ? 0.85 : 0.35;
          const impatient = ratio < 0.28 ? (1 - ratio / 0.28) : 0;

          for (let i = 1; i < NODES; i++) {
            const n = nodes[i], t = i / (NODES - 1);
            const restX = layout.tailBaseX + i * segLen * 0.96;
            const restY = layout.tailBaseY + Math.sin(time * 1.4 - i * 0.25) * 8 * t;
            n.vx += (restX - n.x) * 0.024;
            n.vy += (restY - n.y) * 0.024;
            if (impatient > 0 && i > caughtIndex) n.vy += Math.sin(time * 26 + i * 0.6) * impatient * 1.15;

            if (pointer.active) {
              const distIdx = i - caughtIndex;
              const pullW = 0.14 * Math.exp(-(distIdx * distIdx) / 14) * Math.min(1, i / 3);
              if (pullW > 0.008) {
                n.vx += Math.max(-42, Math.min(42, pointer.x - n.x)) * pullW;
                n.vy += Math.max(-42, Math.min(42, pointer.y - n.y)) * pullW;
              }
            }
            const dp = Math.hypot(n.x - pointer.x, n.y - pointer.y);
            if (dp < 42 * layout.scale) {
              const targetNap = Math.max(-5.5, Math.min(5.5, pointer.vx * 0.55));
              n.furTravel += (targetNap - n.furTravel) * 0.25;
            } else n.furTravel *= 0.9;

            n.vx *= 0.78; n.vy *= 0.78;
            n.x += n.vx; n.y += n.vy;
          }

          if (pointer.active) {
            const nearest = closestTailNode(pointer.x, pointer.y);
            if (nearest.dist < 58 * layout.scale) {
              caughtIndex = nearest.idx;
              strokeAccumulator += pointer.speed;
              if (strokeAccumulator > 65) {
                strokeAccumulator = 0;
                furSheens.push({ x: pointer.x, y: pointer.y, r: 8, life: 1 });
                if (Math.random() < 0.45) {
                  const qs = BText(breed).quips;
                  spawnText(qs[2 + Math.floor(Math.random() * 2)], pointer.x, Math.max(30, pointer.y - 22), 'pet');
                }
              }
            }
            if (Math.hypot(pointer.x - layout.tailBaseX, pointer.y - layout.tailBaseY) > segLen * NODES * 1.38) {
              releaseIntoEscape(T().tooHard);
            }
          }
          if (holdTimer <= 0) releaseIntoEscape(T().enoughPop);
        } else {
          const effRadius = breed.dodgeRadius * (1 - calm * 0.38);
          const effRepel = breed.repelPower * (1 - calm * 0.42);
          let nearestDist = Infinity;

          for (let i = 1; i < NODES; i++) {
            const n = nodes[i], t = i / (NODES - 1);
            const swaySpeed = tailState === 'escaping' ? 4.2 : (1.15 - calm * 0.35);
            const swayAmp = (tailState === 'escaping' ? 26 : 22) * layout.scale * t;
            const restX = layout.tailBaseX + i * segLen * 0.94;
            const restY = layout.tailBaseY - Math.sin(t * Math.PI * 0.85) * 28 * layout.scale + Math.sin(time * swaySpeed - i * 0.32) * swayAmp;
            n.vx += (restX - n.x) * (0.042 + (1 - t) * 0.03);
            n.vy += (restY - n.y) * (0.042 + (1 - t) * 0.03);
            n.furTravel *= 0.88;

            if (pointer.active && tailState === 'free') {
              const dx = n.x - pointer.x, dy = n.y - pointer.y, dist = Math.hypot(dx, dy);
              if (dist < nearestDist) nearestDist = dist;
              const sneakFactor = Math.min(1, 0.38 + pointer.speed / 10);
              if (dist < effRadius && dist > 0.01) {
                const norm = 1 - dist / effRadius;
                const force = norm * norm * effRepel * sneakFactor * (0.45 + t * 1.1) * 4.4;
                const ux = dx / dist, uy = dy / dist;
                n.vx += (ux * 0.78 - uy * evasiveDir * 0.45) * force;
                n.vy += (uy * 0.85 + ux * evasiveDir * 0.55) * force;
              }
            }
            n.vx *= 0.83; n.vy *= 0.83;
            n.x += n.vx; n.y += n.vy;

            const pad = 24;
            if (n.x > width - pad) { n.x = width - pad; n.vx *= -0.5; }
            if (n.x < layout.tailBaseX - 18) { n.x = layout.tailBaseX - 18; n.vx += 1.0; }
            if (n.y < pad) { n.y = pad; n.vy *= -0.5; evasiveDir = 1; }
            if (n.y > height - pad) { n.y = height - pad; n.vy *= -0.5; evasiveDir = -1; }
          }

          if (pointer.active && tailState === 'free' && nearestDist < effRadius * 0.56 && pointer.speed > breed.maxCatchSpeed * 0.65) {
            triggerDodgeBurst(pointer.x, pointer.y, false);
          }
          if (backPetGlow > 0.15) purrTarget = 0.65;
        }

        const MAX_ROOT_ANGLE = 0.52, MAX_JOINT_BEND = 0.24;
        for (let iter = 0; iter < 5; iter++) {
          nodes[0].x = layout.tailBaseX;
          nodes[0].y = layout.tailBaseY;
          for (let i = 1; i < NODES - 1; i++) {
            nodes[i].x += ((nodes[i - 1].x + nodes[i + 1].x) * 0.5 - nodes[i].x) * 0.18;
            nodes[i].y += ((nodes[i - 1].y + nodes[i + 1].y) * 0.5 - nodes[i].y) * 0.18;
          }
          let prevAngle = 0;
          for (let i = 1; i < NODES; i++) {
            const p = nodes[i - 1], c = nodes[i];
            let angle = Math.atan2(c.y - p.y, c.x - p.x);
            if (i === 1) angle = Math.max(-MAX_ROOT_ANGLE, Math.min(MAX_ROOT_ANGLE, angle));
            else angle = prevAngle + Math.max(-MAX_JOINT_BEND, Math.min(MAX_JOINT_BEND, wrapAngle(angle - prevAngle)));
            c.x = p.x + Math.cos(angle) * segLen;
            c.y = p.y + Math.sin(angle) * segLen;
            prevAngle = angle;
          }
        }

        setPurrLevel(purrTarget);
        for (let i = floatTexts.length - 1; i >= 0; i--) { floatTexts[i].y += floatTexts[i].vy; floatTexts[i].life -= dt * 1.15; if (floatTexts[i].life <= 0) floatTexts.splice(i, 1); }
        for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].r += dt * 115; ripples[i].life -= dt * 2.4; if (ripples[i].life <= 0) ripples.splice(i, 1); }
        for (let i = furSheens.length - 1; i >= 0; i--) { furSheens[i].r += dt * 42; furSheens[i].life -= dt * 2.6; if (furSheens[i].life <= 0) furSheens.splice(i, 1); }
        pointer.vx *= 0.65; pointer.vy *= 0.65; pointer.speed = Math.hypot(pointer.vx, pointer.vy);
      }

      function draw() {
        ctx.drawImage(floorCanvas, 0, 0, width, height);
        const sprites = loadBreedSprites(breed);

        ctx.save();
        ctx.globalAlpha = swapFade;
        drawPhotorealisticTail(sprites.tail);

        if (sprites.body.complete && sprites.body.naturalWidth) {
          const breathe = 1 + Math.sin(time * 1.6) * 0.011 + (tailState === 'caught' ? Math.sin(time * 16) * 0.003 : 0);
          const cw = layout.catW * breathe, ch = layout.catH * breathe;

          ctx.save();
          ctx.beginPath();
          ctx.ellipse(layout.catX + 6, layout.catY + ch * 0.12, cw * 0.46, ch * 0.42, 0.03, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(42,24,10,0.28)';
          ctx.filter = 'blur(14px)';
          ctx.fill();
          ctx.restore();

          ctx.drawImage(sprites.body, layout.catX - cw * 0.5, layout.catY - ch * 0.5, cw, ch);

          if (backPetGlow > 0.02) {
            ctx.save();
            const g = ctx.createRadialGradient(pointer.x, pointer.y, 4, pointer.x, pointer.y, 48);
            g.addColorStop(0, `rgba(255,244,214,${backPetGlow * 0.25})`);
            g.addColorStop(1, 'rgba(255,244,214,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, 48, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
        ctx.restore();

        furSheens.forEach((fs) => {
          ctx.save();
          const g = ctx.createRadialGradient(fs.x, fs.y, 2, fs.x, fs.y, fs.r);
          g.addColorStop(0, `rgba(255,246,224,${fs.life * 0.35})`);
          g.addColorStop(1, 'rgba(255,246,224,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(fs.x, fs.y, fs.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        ripples.forEach((rp) => {
          ctx.save();
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.strokeStyle = rp.color;
          ctx.globalAlpha = Math.max(0, rp.life * 0.7);
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        });

        if (tailState === 'caught' && pointer.active) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, 18, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,248,232,0.22)';
          ctx.strokeStyle = 'rgba(255,248,232,0.72)';
          ctx.lineWidth = 1.8;
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.font = '600 13px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        floatTexts.forEach((ft) => {
          ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.4));
          ctx.fillStyle = 'rgba(0,0,0,0.45)';
          ctx.fillText(ft.text, ft.x + 1, ft.y + 1);
          ctx.fillStyle = ft.tone === 'catch' ? '#a7f3d0' : (ft.tone === 'dodge' ? '#fde68a' : '#fffbeb');
          ctx.fillText(ft.text, ft.x, ft.y);
        });
        ctx.restore();
      }

      let lastTs = performance.now();
      function loop(ts) {
        const dt = Math.min(0.04, (ts - lastTs) / 1000);
        lastTs = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      canvas.addEventListener('pointermove', (e) => {
        const p = getPos(e);
        pointer.vx = p.x - pointer.lastX;
        pointer.vy = p.y - pointer.lastY;
        pointer.speed = Math.hypot(pointer.vx, pointer.vy);
        pointer.lastX = p.x; pointer.lastY = p.y;
        pointer.x = p.x; pointer.y = p.y;
        pointer.active = true;
        if (tailState !== 'caught' && isOverCatBody(p.x, p.y) && pointer.speed > 1.2) {
          calm = Math.min(1, calm + 0.013);
          backPetGlow = 1;
          if (Math.random() < 0.045) spawnText(T().purrPop, p.x, Math.max(30, p.y - 20), 'pet');
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        const p = getPos(e);
        pointer.x = p.x; pointer.y = p.y; pointer.lastX = p.x; pointer.lastY = p.y;
        pointer.active = true; pointer.down = true;
        canvas.style.cursor = 'grabbing';
        ensureAudio();

        if (isOverCatBody(p.x, p.y)) {
          calm = Math.min(1, calm + 0.11);
          backPetGlow = 1;
          spawnRipple(p.x, p.y, 'rgba(255,240,200,0.75)');
          spawnText(T().petBackPop, p.x, Math.max(30, p.y - 22), 'pet');
          return;
        }
        if (tailState === 'free') {
          const nearest = closestTailNode(p.x, p.y);
          const catchTol = breed.catchRadius * (1 + calm * 0.45);
          if (nearest.dist <= catchTol) enterCaught(nearest.idx, p.x, p.y);
          else if (nearest.dist < breed.dodgeRadius * 1.2) {
            spawnRipple(p.x, p.y, 'rgba(253,230,138,0.75)');
            triggerDodgeBurst(p.x, p.y, true);
          } else spawnRipple(p.x, p.y);
        }
      });

      window.addEventListener('pointerup', () => {
        pointer.down = false;
        canvas.style.cursor = 'grab';
        if (tailState === 'caught') releaseIntoEscape(T().letGo);
      });

      canvas.addEventListener('pointerleave', () => {
        pointer.active = false; pointer.down = false;
        canvas.style.cursor = 'grab';
        if (tailState === 'caught') releaseIntoEscape(T().slipped);
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          calm = Math.min(1, calm + 0.16);
          backPetGlow = 1;
          pointer.x = layout.catX; pointer.y = layout.catY;
          spawnRipple(layout.catX, layout.catY, 'rgba(255,240,200,0.75)');
          spawnText(T().purrPop, layout.catX, layout.catY - 30, 'pet');
        } else if (e.key === 't' || e.key === 'T') {
          const tip = nodes[Math.floor(NODES * 0.72)];
          pointer.x = tip.x; pointer.y = tip.y; pointer.active = true;
          if (tailState === 'free') {
            if (calm > 0.45 || Math.random() < 0.35) enterCaught(Math.floor(NODES * 0.72), tip.x, tip.y);
            else { spawnRipple(tip.x, tip.y, 'rgba(253,230,138,0.75)'); triggerDodgeBurst(tip.x, tip.y, true); }
          }
        } else if (e.key === 'ArrowRight') {
          selectBreed(currentIdx + 1);
        } else if (e.key === 'ArrowLeft') {
          selectBreed(currentIdx - 1);
        }
      });

      langSelect.addEventListener('change', () => {
        lang = langSelect.value;
        try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
        applyLanguageUI();
      });

      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? T().soundOn : T().soundOff;
        soundBtn.classList.toggle('active', soundOn);
        if (soundOn) ensureAudio();
        else setPurrLevel(0);
      });

      resetBtn.addEventListener('click', () => {
        stats[breed.id] = { dodge: 0, catch: 0 };
        saveStats();
        calm = 0.16;
        tailState = 'free';
        patienceWrap.classList.remove('show');
        initTail();
        renderEncyclopedia();
        setStatus(T().statusReset(BText(breed).name), false);
      });

      window.addEventListener('resize', resize);
      applyLanguageUI();
      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

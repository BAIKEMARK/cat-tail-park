<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>猫尾图鉴 · Cat Tail Park</title>
  <meta name="description" content="Photorealistic overhead multi-breed cat encyclopedia & interactive cat tail simulator. Reach for the tail and it dodges—sneak close or pet its back to catch and stroke it!" />
  <meta property="og:title" content="Cat Tail Park · 猫尾图鉴 (Final Morphed Hand Edition)" />
  <meta property="og:description" content="Interactive photorealistic cat tail dodging & petting simulator with 8 cat breeds." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --bg: #fbf5ec;
      --surface: #fffcf7;
      --surface-alt: #f4eadc;
      --border: #e5d6c3;
      --ink: #3b2a1d;
      --ink-muted: #7a6452;
      --accent: #c9732e;
      --accent-soft: #f5e2cc;
      --ok: #2e8555;
      --shadow: 0 10px 30px rgba(68, 42, 18, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 18px 40px;
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand span {
      font-size: 13px;
      color: var(--ink-muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn, .lang-select {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 140ms ease;
      font-family: inherit;
    }

    .lang-select {
      padding-right: 26px;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
      background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .btn:hover, .lang-select:hover {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .btn.active {
      background: var(--ink);
      color: #fffcf7;
      border-color: var(--ink);
    }

    .badge-progress {
      font-size: 12.5px;
      color: var(--ink-muted);
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .badge-progress strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* Stage */
    .stage-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: #d8bc99;
    }

    #stage {
      display: block;
      width: 100%;
      height: 390px;
      cursor: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .hud-top-left {
      pointer-events: none;
      position: absolute;
      top: 12px;
      left: 14px;
      max-width: calc(100% - 170px);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34, 22, 12, 0.62);
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      flex-shrink: 0;
    }
    .dot.ok { background: #34d399; }

    .hud-top-right {
      pointer-events: none;
      position: absolute;
      top: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34, 22, 12, 0.54);
      color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
    }

    .meter {
      width: 64px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      background: #6ee7b7;
      width: 15%;
    }

    .hud-bottom {
      pointer-events: none;
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(34, 22, 12, 0.68);
      color: #fff;
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 180ms ease;
      white-space: nowrap;
    }

    .hud-bottom.show { opacity: 1; }
    .hud-bottom .meter { width: 128px; }

    /* Breed Encyclopedia Section */
    .encyclopedia {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
    }

    @media (max-width: 780px) {
      .encyclopedia { grid-template-columns: 1fr; }
      #stage { height: 320px; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13.5px;
      font-weight: 600;
      gap: 8px;
    }

    .panel-title small {
      font-weight: 400;
      color: var(--ink-muted);
      font-size: 12px;
    }

    .breed-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 520px) {
      .breed-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .breed-card {
      position: relative;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 9px 10px;
      cursor: pointer;
      transition: all 140ms ease;
      color: var(--ink);
    }

    .breed-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .breed-card.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .breed-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(59, 42, 29, 0.22);
    }

    .caught-tag {
      font-size: 10.5px;
      color: var(--ok);
      font-weight: 600;
    }

    .breed-name {
      font-size: 13px;
      font-weight: 600;
      display: block;
    }

    .breed-sub {
      font-size: 11px;
      color: var(--ink-muted);
      display: block;
      margin-top: 1px;
    }

    /* Profile Card */
    .profile-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .profile-head h2 {
      margin: 0;
      font-size: 17px;
    }

    .profile-head span {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .tag {
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--ink);
    }

    .profile-desc {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-muted);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .stat-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 7px 9px;
      text-align: center;
    }

    .stat-box .val {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: block;
    }

    .stat-box .lbl {
      font-size: 11px;
      color: var(--ink-muted);
    }

    .footer-hint {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-muted);
    }
  </style>
</head>

          <option value="en">English</option>
          <option value="ja">日本語</option>

          <option value="es">Español</option>

      <div class="hud-top-right">

      <div id="patience-wrap" class="hud-bottom">

        <div class="meter"><div id="patience-bar" class="meter-fill" style="width:100%;background:#fcd34d;"></div></div>
      </div>
    </section>

    <section class="encyclopedia">
      <div class="panel">

        <div id="breed-grid" class="breed-grid"></div>
      </div>

      <aside class="panel" id="breed-profile">
        <div class="profile-head">
          <h2 id="p-name"></h2>
          <span id="p-en"></span>
        </div>
        <div id="p-tags" class="profile-tags"></div>
        <p id="p-desc" class="profile-desc"></p>
        <div class="stats-row">
          <div class="stat-box">
            <span id="s-dodge" class="val">0</span>
            <span id="ui-stat-dodge" class="lbl">尾巴躲开</span>
          </div>
          <div class="stat-box">
            <span id="s-catch" class="val">0</span>
            <span id="ui-stat-catch" class="lbl">成功抓到</span>
          </div>
          <div class="stat-box">
            <span id="s-hold" class="val">5.0s</span>
            <span id="ui-stat-hold" class="lbl">基础可撸</span>
          </div>
        </div>
      </aside>
    </section>

    <footer class="footer-hint">
      <span id="ui-footer-tip"></span>
      <span id="ui-footer-keys"></span>
    </footer>
  </main>

      const spriteCache = {};
      function loadBreedSprites(b) {
        if (spriteCache[b.id]) return spriteCache[b.id];
        const entry = { body: new Image(), tail: new Image(), ready: 0 };
        entry.body.onload = () => { entry.ready++; };
        entry.tail.onload = () => { entry.ready++; };
        entry.body.src = INLINED_ASSETS[b.id + '_body'];

        return entry;

      // Warm sunlit oak floor canvas
      const floorCanvas = document.createElement('canvas');
      function buildWoodFloor(w, h) {
        floorCanvas.width = Math.max(1, Math.round(w));
        floorCanvas.height = Math.max(1, Math.round(h));
        const fc = floorCanvas.getContext('2d');
        const bgGrad = fc.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, '#e6d1b6');
        bgGrad.addColorStop(0.55, '#d8bc99');
        bgGrad.addColorStop(1, '#c8a782');
        fc.fillStyle = bgGrad;
        fc.fillRect(0, 0, w, h);

        const plankH = 60;
        let seed = 2026;
        const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
        for (let py = 0; py < h; py += plankH) {
          const tint = (rand() - 0.5) * 14;
          fc.fillStyle = `rgba(${tint > 0 ? 255 : 95},${tint > 0 ? 238 : 65},${tint > 0 ? 210 : 38},${Math.abs(tint) / 145})`;
          fc.fillRect(0, py, w, plankH);
          for (let g = 0; g < 18; g++) {
            const gy = py + rand() * plankH;
            fc.beginPath();
            fc.moveTo(0, gy);
            for (let gx = 0; gx <= w; gx += 52) fc.lineTo(gx, gy + Math.sin(gx * 0.011 + g) * 1.6);
            fc.strokeStyle = `rgba(110,74,42,${0.032 + rand() * 0.038})`;
            fc.lineWidth = 0.8 + rand() * 1.2;
            fc.stroke();
          }
          fc.fillStyle = 'rgba(84,54,28,0.16)';
          fc.fillRect(0, py, w, 1.2);
          fc.fillStyle = 'rgba(84,54,28,0.12)';
          fc.fillRect((rand() * 0.7 + 0.15) * w, py, 1.2, plankH);
        }
        const sunGrad = fc.createRadialGradient(w * 0.25, h * 0.12, 20, w * 0.35, h * 0.35, w * 0.72);
        sunGrad.addColorStop(0, 'rgba(255,248,232,0.38)');
        sunGrad.addColorStop(0.55, 'rgba(255,242,215,0.12)');
        sunGrad.addColorStop(1, 'rgba(70,45,22,0.14)');
        fc.fillStyle = sunGrad;
        fc.fillRect(0, 0, w, h);
      }

      const approach = (a, b, dt, s) => a + (b - a) * -Math.expm1(-dt / Math.max(0.001, s));
      function turnSpring(n, goal, rate, dt) {
        const offset = n.angle - goal;
        const speed = n.turnRate + rate * offset;
        const decay = Math.exp(-rate * dt);
        n.angle = goal + (offset + speed * dt) * decay;
        n.turnRate = (n.turnRate - speed * rate * dt) * decay;
      }

      // Synthesized Web Audio cat purr + whoosh
      let soundOn = false, audioCtx = null, purrGain = null, purrLfo = null;
      function ensureAudio() {
        if (!soundOn) return;
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufLen = audioCtx.sampleRate * 2;
            const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < bufLen; i++) {
              const white = Math.random() * 2 - 1;
              data[i] = (lastOut + 0.025 * white) / 1.025;
              lastOut = data[i];
              data[i] *= 3.5;
            }
            const src = audioCtx.createBufferSource();
            src.buffer = noiseBuf;
            src.loop = true;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 115;
            filter.Q.value = 1.4;
            purrLfo = audioCtx.createOscillator();
            purrLfo.type = 'sine';
            purrLfo.frequency.value = breed.purrHz;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 0.45;
            const modGain = audioCtx.createGain();
            modGain.gain.value = 0.55;
            purrLfo.connect(lfoGain);
            lfoGain.connect(modGain.gain);
            purrGain = audioCtx.createGain();
            purrGain.gain.value = 0.0001;
            src.connect(filter);
            filter.connect(modGain);
            modGain.connect(purrGain);
            purrGain.connect(audioCtx.destination);
            src.start();
            purrLfo.start();
          }
          if (purrLfo) purrLfo.frequency.setTargetAtTime(breed.purrHz, audioCtx.currentTime, 0.05);
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (_) {}
      }

      function setPurrLevel(level) {
        if (!audioCtx || !purrGain) return;
        const target = soundOn ? Math.max(0.0001, level * 0.22) : 0.0001;
        purrGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.08);
      }

      function playWhoosh() {
        if (!soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.09);
          g.gain.setValueAtTime(0.045, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (_) {}
      }

      function rebuildTailPositions() {
        if (!nodes.length) return;
        let x = layout.tailBaseX;
        let y = layout.tailBaseY;
        nodes[0].x = x;
        nodes[0].y = y;
        for (let i = 1; i < NODES; i++) {
          const a = nodes[i - 1].angle;
          x += Math.cos(a) * layout.segLen;
          y += Math.sin(a) * layout.segLen;
          nodes[i].x = x;
          nodes[i].y = y;
        }
      }

      function initTail() {
        nodes.length = 0;
        for (let i = 0; i < NODES; i++) {
          const t = i / (NODES - 1);
          const rest = -0.18 * Math.sin(t * Math.PI * 0.9);
          nodes.push({ x: layout.tailBaseX + i * layout.segLen, y: layout.tailBaseY, angle: rest, rest, turnRate: 0, furTravel: 0 });
        }
        rebuildTailPositions();
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = rect.height || 390;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildWoodFloor(width, height);

        const s = Math.min(1.18, Math.max(0.72, width / 760));
        layout.scale = s;
        layout.catW = 355 * s;
        layout.catH = layout.catW * (302 / 489);
        layout.catX = Math.max(layout.catW * 0.52 + 12, width * 0.29);
        layout.catY = height * 0.52;
        layout.tailBaseX = layout.catX + layout.catW * 0.42;
        layout.tailBaseY = layout.catY + layout.catH * 0.03;
        // 25 segments spanning the exact same total tail length (~245px * scale)
        layout.segLen = (245 * s) / (NODES - 1);

        if (nodes.length === 0) initTail();
        else rebuildTailPositions();
      }

      function selectBreed(idx) {
        currentIdx = (idx + BREEDS.length) % BREEDS.length;
        breed = BREEDS[currentIdx];
        loadBreedSprites(breed);
        tailState = 'free';
        escapeCooldown = 0;
        dodgeSweep = 0;
        calm = 0.16;
        swapFade = 0.2;
        patienceWrap.classList.remove('show');
        initTail();
        if (purrLfo && audioCtx) purrLfo.frequency.setTargetAtTime(breed.purrHz, audioCtx.currentTime, 0.05);
        setStatus(T().statusSwitched(BText(breed).name), false);
        renderEncyclopedia();
      }

      function setStatus(text, isOk) {
        statusText.textContent = text;
        statusDot.className = isOk ? 'dot ok' : 'dot';
      }

      function spawnText(text, x, y, tone) { floatTexts.push({ text, x, y, vy: -0.7, life: 1, tone: tone || 'warm' }); }
      function spawnRipple(x, y, color) { ripples.push({ x, y, r: 5, life: 1, color: color || 'rgba(255,255,255,0.75)' }); }

      function closestTailNode(px, py) {
        let bestIdx = -1, bestDist = Infinity;
        for (let i = 3; i < NODES; i++) {
          const d = Math.hypot(nodes[i].x - px, nodes[i].y - py);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        return { idx: bestIdx, dist: bestDist };
      }

      function isOverCatBody(px, py) {
        const dx = (px - (layout.catX - layout.catW * 0.03)) / (layout.catW * 0.44);
        const dy = (py - layout.catY) / (layout.catH * 0.43);
        return dx * dx + dy * dy <= 1;
      }

      function enterCaught(idx, px, py) {
        tailState = 'caught';
        caughtIndex = Math.max(4, Math.min(NODES - 1, idx));
        holdMax = breed.holdDuration * (1 + calm * 0.45);
        holdTimer = holdMax;
        strokeAccumulator = 0;
        dodgeSweep = 0;
        stats[breed.id].catch++;
        saveStats();
        renderEncyclopedia();
        patienceWrap.classList.add('show');
        setStatus(T().statusCaught(BText(breed).name), true);
        spawnRipple(px, py, 'rgba(110,231,183,0.9)');
        spawnText(T().caughtPop, px, Math.max(32, py - 24), 'catch');
      }

      function releaseIntoEscape(reasonText) {
        tailState = 'escaping';
        escapeCooldown = 0.68;
        patienceWrap.classList.remove('show');
        evasiveDir = (pointer.y < layout.tailBaseY) ? 1 : -1;
        dodgeSweep = evasiveDir * 0.92;
        for (let i = 0; i < NODES; i++) {
          const t = i / (NODES - 1);
          nodes[i].turnRate += evasiveDir * (3.2 + t * 5.2);
        }
        calm = Math.max(0.08, calm - 0.18);
        playWhoosh();
        const tip = nodes[NODES - 1];
        spawnText(reasonText || T().escapedDefault, Math.min(width - 60, Math.max(50, tip.x)), Math.max(32, tip.y - 18), 'dodge');
        setStatus(T().statusEscaped, false);
      }

      function triggerDodgeBurst(px, py, forceful) {
        const now = performance.now();
        evasiveDir = py < layout.tailBaseY ? 1 : -1;
        const burst = (forceful ? 0.92 : 0.62) * (1 - calm * 0.28);
        dodgeSweep = evasiveDir * burst;
        for (let i = 0; i < NODES; i++) {
          const t = i / (NODES - 1);
          nodes[i].turnRate += evasiveDir * (forceful ? 4.4 : 2.6) * (0.4 + t * 0.9);
        }
        if (now - lastDodgeAt > 460) {
          stats[breed.id].dodge++;
          saveStats();
          sDodge.textContent = stats[breed.id].dodge;
          lastDodgeAt = now;
          playWhoosh();
          const qs = BText(breed).quips;
          const tip = nodes[NODES - 1];
          spawnText(qs[Math.floor(Math.random() * 2)], Math.min(width - 60, Math.max(50, tip.x)), Math.max(32, tip.y - 18), 'dodge');
        }
      }

      function wrapAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }

      function drawTexturedTriangle(g, photo, a, b, c) {
        const u = b.s - a.s, v = b.t - a.t, p = c.s - a.s, q = c.t - a.t, D = u * q - v * p;
        if (Math.abs(D) < 1e-4) return;
        const X = b.x - a.x, Y = b.y - a.y, Z = c.x - a.x, W = c.y - a.y;
        const m = (X * q - Z * v) / D, n = (Y * q - W * v) / D;
        const h = (Z * u - X * p) / D, k = (W * u - Y * p) / D;
        const ab = Math.hypot(X, Y), ac = Math.hypot(Z, W), bc = Math.hypot(X - Z, Y - W), perim = ab + ac + bc;
        if (perim < 0.01) return;
        const cx = (a.x * bc + b.x * ac + c.x * ab) / perim, cy = (a.y * bc + b.y * ac + c.y * ab) / perim;
        const expand = Math.min(1.1, 0.52 * perim / Math.max(0.05, Math.abs(X * W - Y * Z)));

        g.save();
        g.beginPath();
        const pts = [a, b, c];
        for (let i = 0; i < 3; i++) {
          const ex = pts[i].x + (pts[i].x - cx) * expand;
          const ey = pts[i].y + (pts[i].y - cy) * expand;
          if (i === 0) g.moveTo(ex, ey); else g.lineTo(ex, ey);
        }
        g.closePath();
        g.clip();
        g.transform(m, n, h, k, a.x - m * a.s - h * a.t, a.y - n * a.s - k * a.t);
        const l = Math.max(0, Math.floor(Math.min(a.s, b.s, c.s)) - 1);
        const t = Math.max(0, Math.floor(Math.min(a.t, b.t, c.t)) - 1);
        const w = Math.min(photo.width, Math.ceil(Math.max(a.s, b.s, c.s)) + 1) - l;
        const hh = Math.min(photo.height, Math.ceil(Math.max(a.t, b.t, c.t)) + 1) - t;
        if (w > 0 && hh > 0) g.drawImage(photo, l, t, w, hh, l, t, w, hh);
        g.restore();
      }

      function drawPhotorealisticTail(tailImg) {
        if (!tailImg.complete || !tailImg.naturalWidth) return;
        const pw = tailImg.width, ph = tailImg.height;
        const halfH = ph * 0.5 * layout.scale * 0.56 * breed.tailScale;

        // Fast zero-blur soft layered tail shadow (60/120fps!)
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(nodes[0].x + 3, nodes[0].y + 10 * layout.scale);
        for (let i = 1; i < NODES; i++) ctx.lineTo(nodes[i].x + 4, nodes[i].y + 11 * layout.scale);
        ctx.strokeStyle = 'rgba(42,24,10,0.09)';
        ctx.lineWidth = 34 * layout.scale * breed.tailScale;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(42,24,10,0.13)';
        ctx.lineWidth = 22 * layout.scale * breed.tailScale;
        ctx.stroke();
        ctx.restore();

        // Single-band 26-joint smooth triangle strip (zero centerline seam, silky continuous curve)
        let prevTop = null, prevBot = null;
        for (let i = 0; i < NODES; i++) {
          const n = nodes[i];
          const prev = nodes[Math.max(0, i - 1)];
          const next = nodes[Math.min(NODES - 1, i + 1)];
          const dx = next.x - prev.x, dy = next.y - prev.y, len = Math.hypot(dx, dy) || 1;
          const tx = dx / len, ty = dy / len, nx = -ty, ny = tx;
          const u = (i / (NODES - 1)) * pw;
          const top = { s: u, t: 0, x: n.x - nx * halfH + tx * n.furTravel, y: n.y - ny * halfH + ty * n.furTravel };
          const bot = { s: u, t: ph, x: n.x + nx * halfH + tx * n.furTravel, y: n.y + ny * halfH + ty * n.furTravel };
          if (prevTop) {
            drawTexturedTriangle(ctx, tailImg, prevTop, top, prevBot);
            drawTexturedTriangle(ctx, tailImg, prevBot, top, bot);
          }
          prevTop = top;
          prevBot = bot;
        }
      }

      function update(dt) {
        time += dt;
        swapFade = Math.min(1, swapFade + dt * 3.8);
        dodgeSweep = approach(dodgeSweep, 0, dt, 0.42);
        if (escapeCooldown > 0) {
          escapeCooldown -= dt;
          if (escapeCooldown <= 0 && tailState === 'escaping') {
            tailState = 'free';
            setStatus(T().statusDefault(BText(breed).name), false);
          }
        }

        calm = Math.max(0.12, calm - dt * 0.024);
        calmBar.style.width = Math.round(calm * 100) + '%';
        backPetGlow = Math.max(0, backPetGlow - dt * 2.2);

        // Supple cat body compliance when petting the back
        const overBody = pointer.active && isOverCatBody(pointer.x, pointer.y);
        const wantShearX = (overBody && tailState !== 'caught') ? Math.max(-5, Math.min(5, pointer.vx * 0.35)) : 0;
        const wantShearY = (overBody && tailState !== 'caught') ? Math.max(-3.5, Math.min(3.5, pointer.vy * 0.25)) : 0;
        bodyShear.x = approach(bodyShear.x, wantShearX, dt, 0.09);
        bodyShear.y = approach(bodyShear.y, wantShearY, dt, 0.09);

        let purrTarget = 0;

        if (tailState === 'caught') {
          holdTimer -= dt;
          const ratio = Math.max(0, holdTimer / holdMax);
          patienceBar.style.width = Math.round(ratio * 100) + '%';
          patienceBar.style.backgroundColor = ratio < 0.28 ? '#fb7185' : '#fcd34d';
          purrTarget = pointer.speed > 0.8 ? 0.85 : 0.35;
          const impatient = ratio < 0.28 ? (1 - ratio / 0.28) : 0;

          // Smooth analytical angle curve toward hand (zero kinks, silky follow!)
          const dx = Math.max(12, pointer.x - layout.tailBaseX);
          const dy = pointer.y - layout.tailBaseY;
          const targetYaw = Math.max(-0.78, Math.min(0.78, Math.atan2(dy, dx)));

          for (let i = 0; i < NODES; i++) {
            const n = nodes[i], t = i / (NODES - 1);
            const bendW = Math.min(1, t / 0.28);
            const idleWave = Math.sin(time * 1.6 - t * 3.2) * 0.06 * t;
            const twitch = (impatient > 0 && i >= caughtIndex) ? Math.sin(time * 24 - t * 5) * impatient * 0.24 : 0;
            const goal = targetYaw * bendW + idleWave + twitch;
            turnSpring(n, goal, 11.5 - t * 3.2, dt);

            const dp = Math.hypot(n.x - pointer.x, n.y - pointer.y);
            const targetNap = dp < 46 * layout.scale ? Math.max(-5.5, Math.min(5.5, pointer.vx * 0.5)) : 0;
            n.furTravel = approach(n.furTravel, targetNap, dt, 0.08);
          }

          if (pointer.active) {
            const nearest = closestTailNode(pointer.x, pointer.y);
            if (nearest.dist < 62 * layout.scale) {
              caughtIndex = nearest.idx;
              strokeAccumulator += pointer.speed;
              if (strokeAccumulator > 65) {
                strokeAccumulator = 0;
                furSheens.push({ x: pointer.x, y: pointer.y, r: 8, life: 1 });
                if (Math.random() < 0.45) {
                  const qs = BText(breed).quips;
                  spawnText(qs[2 + Math.floor(Math.random() * 2)], pointer.x, Math.max(30, pointer.y - 22), 'pet');
                }
              }
            }
            if (Math.hypot(pointer.x - layout.tailBaseX, pointer.y - layout.tailBaseY) > layout.segLen * NODES * 1.42) {
              releaseIntoEscape(T().tooHard);
            }
          }
          if (holdTimer <= 0) releaseIntoEscape(T().enoughPop);
        } else {
          const effRadius = breed.dodgeRadius * (1 - calm * 0.38);
          let nearestDist = Infinity;
          let nearestNode = null;
          if (pointer.active && tailState === 'free') {
            const hit = closestTailNode(pointer.x, pointer.y);
            nearestDist = hit.dist;
            nearestNode = nodes[hit.idx];
          }

          // Smooth continuous evasive angular deflection when pointer approaches tail
          let proxDeflect = 0;
          if (pointer.active && tailState === 'free' && nearestDist < effRadius && nearestNode) {
            const norm = 1 - nearestDist / effRadius;
            const sneakFactor = Math.min(1, 0.36 + pointer.speed / 10);
            const side = pointer.y < nearestNode.y ? 1 : -1;
            evasiveDir = side;
            proxDeflect = side * norm * norm * breed.repelPower * sneakFactor * 0.68;
          }

          const swaySpeed = tailState === 'escaping' ? 4.4 : (1.25 - calm * 0.32);
          const swayAmp = tailState === 'escaping' ? 0.34 : 0.24;

          for (let i = 0; i < NODES; i++) {
            const n = nodes[i], t = i / (NODES - 1);
            const wave = Math.sin(time * swaySpeed - t * 3.1) * swayAmp * (0.25 + 0.75 * t);
            const dodge = (dodgeSweep + proxDeflect) * (0.3 + 0.85 * Math.sin(t * Math.PI * 0.78));
            const goal = Math.max(-1.05, Math.min(1.05, n.rest + wave + dodge));
            const rate = tailState === 'escaping' ? 14.0 : (8.8 - t * 2.2);
            turnSpring(n, goal, rate, dt);
            n.furTravel = approach(n.furTravel, 0, dt, 0.14);
          }

          if (pointer.active && tailState === 'free' && nearestDist < effRadius * 0.56 && pointer.speed > breed.maxCatchSpeed * 0.65) {
            triggerDodgeBurst(pointer.x, pointer.y, false);
          }
          if (backPetGlow > 0.15) purrTarget = 0.65;
        }

        // Exact O(N) forward kinematics -> zero constraint fighting, 100% silky curve!
        rebuildTailPositions();

        setPurrLevel(purrTarget);
        for (let i = floatTexts.length - 1; i >= 0; i--) { floatTexts[i].y += floatTexts[i].vy; floatTexts[i].life -= dt * 1.15; if (floatTexts[i].life <= 0) floatTexts.splice(i, 1); }
        for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].r += dt * 115; ripples[i].life -= dt * 2.4; if (ripples[i].life <= 0) ripples.splice(i, 1); }
        for (let i = furSheens.length - 1; i >= 0; i--) { furSheens[i].r += dt * 42; furSheens[i].life -= dt * 2.6; if (furSheens[i].life <= 0) furSheens.splice(i, 1); }

        // Critically-damped silky hand follow, press height, open-to-grip pose & tail alignment
        hand.alpha = approach(hand.alpha, pointer.active ? 1 : 0, dt, 0.06);
        if (pointer.active) {
          hand.x = approach(hand.x, pointer.x, dt, 0.032);
          hand.y = approach(hand.y, pointer.y, dt, 0.032);
        }
        const wantGrip = tailState === 'caught' || (pointer.down && !overBody);
        const wantPress = tailState === 'caught' || pointer.down || (overBody && pointer.speed > 0.5);
        hand.grip = approach(hand.grip, wantGrip ? 1 : 0, dt, 0.085);
        hand.press = approach(hand.press, wantPress ? 1 : 0, dt, 0.065);

        let targetRot = Math.max(-0.22, Math.min(0.22, pointer.vx * 0.011));
        if (tailState === 'caught' && caughtIndex >= 1 && caughtIndex < NODES) {
          targetRot = Math.max(-0.55, Math.min(0.55, nodes[Math.max(0, caughtIndex - 1)].angle * 0.48));
        }
        hand.rot = approach(hand.rot, targetRot, dt, 0.075);

        pointer.vx *= 0.65; pointer.vy *= 0.65; pointer.speed = Math.hypot(pointer.vx, pointer.vy);
      }

      // Pixel-aligned anatomical landmarks between hand_open.webp (A) and user's hand_grip.webp (B)
      const HAND_LANDMARKS = [
        { a: [0.64, 0.67], b: [0.64, 0.67] }, // wrist
        { a: [0.84, 0.90], b: [0.84, 0.90] }, // forearm
        { a: [0.54, 0.54], b: [0.54, 0.54] }, // palm back
        { a: [0.31, 0.45], b: [0.35, 0.44] }, // thumb tip
        { a: [0.29, 0.29], b: [0.34, 0.34] }, // index tip
        { a: [0.34, 0.24], b: [0.38, 0.31] }, // middle tip
        { a: [0.42, 0.25], b: [0.45, 0.30] }, // ring tip
        { a: [0.52, 0.28], b: [0.53, 0.31] }, // pinky tip
        { a: [0.49, 0.42], b: [0.50, 0.42] }  // knuckle ridge
      ];

      function sampleMorphDelta(u, v, isGrip, amount) {
        const soft = 0.010;
        let wx = 0, wy = 0, wSum = 0;
        for (let i = 0; i < HAND_LANDMARKS.length; i++) {
          const lm = HAND_LANDMARKS[i];
          const ref = isGrip ? lm.b : lm.a;
          const dx = u - ref[0], dy = v - ref[1];
          const w = 1 / (dx * dx + dy * dy + soft);
          const diffX = lm.b[0] - lm.a[0];
          const diffY = lm.b[1] - lm.a[1];
          const factor = isGrip ? (amount - 1) : amount;
          wx += diffX * factor * w;
          wy += diffY * factor * w;
          wSum += w;
        }
        return [wx / wSum, wy / wSum];
      }

      function drawMorphedHandMesh(img, size, ax, ay, isGrip, amount, alpha) {
        if (alpha <= 0.01) return;
        const iw = img.width, ih = img.height;
        const GRID = 6;
        const u0 = 0.16, u1 = 0.98, v0 = 0.16, v1 = 0.98;
        const verts = [];
        for (let gy = 0; gy <= GRID; gy++) {
          const row = [];
          const v = v0 + (v1 - v0) * (gy / GRID);
          for (let gx = 0; gx <= GRID; gx++) {
            const u = u0 + (u1 - u0) * (gx / GRID);
            const [du, dv] = sampleMorphDelta(u, v, isGrip, amount);
            row.push({
              s: u * iw,
              t: v * ih,
              x: (u + du - ax) * size,
              y: (v + dv - ay) * size
            });
          }
          verts.push(row);
        }
        ctx.save();
        ctx.globalAlpha = alpha;
        for (let gy = 0; gy < GRID; gy++) {
          for (let gx = 0; gx < GRID; gx++) {
            const a = verts[gy][gx];
            const b = verts[gy][gx + 1];
            const c = verts[gy + 1][gx];
            const d = verts[gy + 1][gx + 1];
            drawTexturedTriangle(ctx, img, a, b, c);
            drawTexturedTriangle(ctx, img, b, d, c);
          }
        }
        ctx.restore();
      }

      function drawRealisticHand() {
        if (hand.alpha <= 0.02) return;
        const openImg = handSprites.open;
        const gripImg = handSprites.grip;
        const openOk = openImg.complete && openImg.naturalWidth > 0;
        const gripOk = gripImg.complete && gripImg.naturalWidth > 0;
        if (!openOk && !gripOk) return;

        const amount = Math.max(0, Math.min(1, hand.grip));
        const pressScale = 1.03 - hand.press * 0.075;
        const size = 250 * layout.scale * pressScale;
        const shadowLift = 14 - hand.press * 9;

        const ax = 0.37;
        const ay = 0.36;

        // Mid-range Hermite crossfade ONLY while both warped meshes align!
        const rawMix = Math.max(0, Math.min(1, (amount - 0.28) / 0.48));
        const mix = rawMix * rawMix * (3 - 2 * rawMix);

        ctx.save();
        ctx.translate(hand.x, hand.y);
        ctx.rotate(hand.rot);

        const padRatio = 256 / 220;
        const sSize = size * padRatio;
        const padOff = size * (18 / 220);
        const shadowAlpha = hand.alpha * (0.24 + hand.press * 0.14);
        if (handShadows.open && mix < 0.99) {
          ctx.save();
          ctx.globalAlpha = shadowAlpha * (1 - mix);
          ctx.drawImage(handShadows.open, -size * ax - padOff + shadowLift * 0.5, -size * ay - padOff + shadowLift, sSize, sSize);
          ctx.restore();
        }
        if (handShadows.grip && mix > 0.01) {
          ctx.save();
          ctx.globalAlpha = shadowAlpha * mix;
          ctx.drawImage(handShadows.grip, -size * ax - padOff + shadowLift * 0.5, -size * ay - padOff + shadowLift, sSize, sSize);
          ctx.restore();
        }

        if (amount <= 0.015 && openOk) {
          ctx.globalAlpha = hand.alpha;
          ctx.drawImage(openImg, -size * ax, -size * ay, size, size);
        } else if (amount >= 0.985 && gripOk) {
          ctx.globalAlpha = hand.alpha;
          ctx.drawImage(gripImg, -size * ax, -size * ay, size, size);
        } else {
          if (openOk && mix < 0.99) drawMorphedHandMesh(openImg, size, ax, ay, false, amount, hand.alpha * (1 - mix));
          if (gripOk && mix > 0.01) drawMorphedHandMesh(gripImg, size, ax, ay, true, amount, hand.alpha * mix);
        }

        ctx.restore();
      }

      function draw() {
        ctx.drawImage(floorCanvas, 0, 0, width, height);
        const sprites = loadBreedSprites(breed);

        ctx.save();
        ctx.globalAlpha = swapFade;
        drawPhotorealisticTail(sprites.tail);

        if (sprites.body.complete && sprites.body.naturalWidth) {
          const breathe = 1 + Math.sin(time * 1.6) * 0.011 + (tailState === 'caught' ? Math.sin(time * 16) * 0.003 : 0);
          const cw = layout.catW * breathe, ch = layout.catH * breathe;
          const bx = layout.catX + bodyShear.x, by = layout.catY + bodyShear.y;

          // Fast zero-blur radial gradient contact shadow
          ctx.save();
          ctx.translate(bx + 6, by + ch * 0.11);
          ctx.scale(1, (ch * 0.46) / (cw * 0.5));
          const sg = ctx.createRadialGradient(0, 0, cw * 0.12, 0, 0, cw * 0.5);
          sg.addColorStop(0, 'rgba(42,24,10,0.30)');
          sg.addColorStop(0.7, 'rgba(42,24,10,0.14)');
          sg.addColorStop(1, 'rgba(42,24,10,0)');
          ctx.fillStyle = sg;
          ctx.beginPath();
          ctx.arc(0, 0, cw * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.drawImage(sprites.body, bx - cw * 0.5, by - ch * 0.5, cw, ch);

          if (backPetGlow > 0.02) {
            ctx.save();
            const g = ctx.createRadialGradient(pointer.x, pointer.y, 4, pointer.x, pointer.y, 48);
            g.addColorStop(0, `rgba(255,244,214,${backPetGlow * 0.25})`);
            g.addColorStop(1, 'rgba(255,244,214,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, 48, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
        ctx.restore();

        furSheens.forEach((fs) => {
          ctx.save();
          const g = ctx.createRadialGradient(fs.x, fs.y, 2, fs.x, fs.y, fs.r);
          g.addColorStop(0, `rgba(255,246,224,${fs.life * 0.35})`);
          g.addColorStop(1, 'rgba(255,246,224,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(fs.x, fs.y, fs.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        ripples.forEach((rp) => {
          ctx.save();
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.strokeStyle = rp.color;
          ctx.globalAlpha = Math.max(0, rp.life * 0.45);
          ctx.lineWidth = 1.6;
          ctx.stroke();
          ctx.restore();
        });

        drawRealisticHand();

        ctx.save();
        ctx.font = '600 13px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        floatTexts.forEach((ft) => {
          ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.4));
          ctx.fillStyle = 'rgba(0,0,0,0.45)';
          ctx.fillText(ft.text, ft.x + 1, ft.y + 1);
          ctx.fillStyle = ft.tone === 'catch' ? '#a7f3d0' : (ft.tone === 'dodge' ? '#fde68a' : '#fffbeb');
          ctx.fillText(ft.text, ft.x, ft.y);
        });
        ctx.restore();
      }

      let lastTs = performance.now();
      function loop(ts) {
        const dt = Math.min(0.04, (ts - lastTs) / 1000);
        lastTs = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      canvas.addEventListener('pointermove', (e) => {
        const p = getPos(e);
        if (!pointer.active) { hand.x = p.x; hand.y = p.y; }
        pointer.vx = p.x - pointer.lastX;
        pointer.vy = p.y - pointer.lastY;
        pointer.speed = Math.hypot(pointer.vx, pointer.vy);
        pointer.lastX = p.x; pointer.lastY = p.y;
        pointer.x = p.x; pointer.y = p.y;
        pointer.active = true;
        if (tailState !== 'caught' && isOverCatBody(p.x, p.y) && pointer.speed > 1.2) {
          calm = Math.min(1, calm + 0.013);
          backPetGlow = 1;
          if (Math.random() < 0.045) spawnText(T().purrPop, p.x, Math.max(30, p.y - 20), 'pet');
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        const p = getPos(e);
        if (!pointer.active) { hand.x = p.x; hand.y = p.y; }
        pointer.x = p.x; pointer.y = p.y; pointer.lastX = p.x; pointer.lastY = p.y;
        pointer.active = true; pointer.down = true;
        ensureAudio();

        if (isOverCatBody(p.x, p.y)) {
          calm = Math.min(1, calm + 0.11);
          backPetGlow = 1;
          spawnRipple(p.x, p.y, 'rgba(255,240,200,0.75)');
          spawnText(T().petBackPop, p.x, Math.max(30, p.y - 22), 'pet');
          return;
        }
        if (tailState === 'free') {
          const nearest = closestTailNode(p.x, p.y);
          const catchTol = breed.catchRadius * (1 + calm * 0.45);
          if (nearest.dist <= catchTol) enterCaught(nearest.idx, p.x, p.y);
          else if (nearest.dist < breed.dodgeRadius * 1.2) {
            spawnRipple(p.x, p.y, 'rgba(253,230,138,0.75)');
            triggerDodgeBurst(p.x, p.y, true);
          } else spawnRipple(p.x, p.y);
        }
      });

      window.addEventListener('pointerup', () => {
        pointer.down = false;
        if (tailState === 'caught') releaseIntoEscape(T().letGo);
      });

      canvas.addEventListener('pointerleave', () => {
        pointer.active = false; pointer.down = false;
        if (tailState === 'caught') releaseIntoEscape(T().slipped);
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          calm = Math.min(1, calm + 0.16);
          backPetGlow = 1;
          pointer.x = layout.catX; pointer.y = layout.catY;
          spawnRipple(layout.catX, layout.catY, 'rgba(255,240,200,0.75)');
          spawnText(T().purrPop, layout.catX, layout.catY - 30, 'pet');
        } else if (e.key === 't' || e.key === 'T') {
          const tip = nodes[Math.floor(NODES * 0.72)];
          pointer.x = tip.x; pointer.y = tip.y; pointer.active = true;
          if (tailState === 'free') {
            if (calm > 0.45 || Math.random() < 0.35) enterCaught(Math.floor(NODES * 0.72), tip.x, tip.y);
            else { spawnRipple(tip.x, tip.y, 'rgba(253,230,138,0.75)'); triggerDodgeBurst(tip.x, tip.y, true); }
          }
        } else if (e.key === 'ArrowRight') {
          selectBreed(currentIdx + 1);
        } else if (e.key === 'ArrowLeft') {
          selectBreed(currentIdx - 1);
        }
      });

      langSelect.addEventListener('change', () => {
        lang = langSelect.value;
        try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
        applyLanguageUI();
      });

      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? T().soundOn : T().soundOff;
        soundBtn.classList.toggle('active', soundOn);
        if (soundOn) ensureAudio();
        else setPurrLevel(0);
      });

      resetBtn.addEventListener('click', () => {
        stats[breed.id] = { dodge: 0, catch: 0 };
        saveStats();
        calm = 0.16;
        tailState = 'free';
        patienceWrap.classList.remove('show');
        initTail();
        renderEncyclopedia();
        setStatus(T().statusReset(BText(breed).name), false);
      });

      window.addEventListener('resize', resize);
      applyLanguageUI();
      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
